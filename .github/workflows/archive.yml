name: Archive official forecasts

# The ensemble files are live-only: a run not captured is gone. Hourly at :37 (off the congested :00),
# so the hourly observed flow stays within the hour. Data is committed to the `data` branch so `main` stays code-only.
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch: {}

concurrency:
  group: archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: data
          path: data-branch
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python archive.py data-branch/data
      - run: python weather.py data-branch/data
        timeout-minutes: 5  # a stalled Open-Meteo hour loses the weather, not the archive, flow and site below
        continue-on-error: true
      - run: python score.py data-branch/data
      - run: python live.py data-branch/data
      - run: python site.py data-branch/data
      - name: Commit new files
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -q -m "archive $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
