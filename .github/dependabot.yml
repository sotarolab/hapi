# Monthly and grouped: at most one pull request per ecosystem per month, each run through qc.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-dev:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    groups:
      app:
        patterns: ["*"]
